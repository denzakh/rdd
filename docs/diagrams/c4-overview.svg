<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 2060" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
    <g id="picon" fill="#ffffff" opacity="0.95">
      <circle cx="0" cy="0" r="11"/>
      <path d="M -15 36 C -15 13 15 13 15 36 Z"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1560" height="2060" fill="#ffffff"/>

  <!-- ===== Заголовок ===== -->
  <text x="40" y="40" font-size="22" font-weight="bold" fill="#1a1a1a">RDD — Регистр депрессивных расстройств · C4 overview</text>
  <text x="40" y="64" font-size="13" fill="#555555">Уровень 1 (System Context) и уровень 2 (Container). Пунктир — опции/будущее, не реализовано в v1. Обоснования решений: docs/architecture-overview.md</text>
  <line x1="40" y1="80" x2="1520" y2="80" stroke="#1168BD" stroke-width="2"/>

  <!-- ===== C4 L1 — System Context ===== -->
  <text x="40" y="118" font-size="16" font-weight="bold" fill="#1168BD">C4 L1 — System Context</text>

  <!-- Персона: Врач -->
  <rect x="40" y="150" width="330" height="120" rx="14" fill="#08427B"/>
  <use href="#picon" x="80" y="172"/>
  <text x="112" y="182" font-size="14" font-weight="bold" fill="#ffffff">Врач (clinician)</text>
  <text x="112" y="204" font-size="12" fill="#ffffff">Ведёт карты пациентов: матрица фаз,</text>
  <text x="112" y="222" font-size="12" fill="#ffffff">терапия, шкалы — в рамках своего</text>
  <text x="112" y="240" font-size="12" fill="#ffffff">data_scope (all / site / assigned)</text>

  <!-- Персона: Администратор -->
  <rect x="40" y="330" width="330" height="120" rx="14" fill="#08427B"/>
  <use href="#picon" x="80" y="352"/>
  <text x="112" y="362" font-size="14" font-weight="bold" fill="#ffffff">Администратор (admin)</text>
  <text x="112" y="384" font-size="12" fill="#ffffff">Создаёт учётные записи (публичной</text>
  <text x="112" y="402" font-size="12" fill="#ffffff">регистрации нет), роли и data_scope,</text>
  <text x="112" y="420" font-size="12" fill="#ffffff">выдаёт одноразовые инвайты</text>

  <!-- Персона: Наблюдатель -->
  <rect x="40" y="510" width="330" height="110" rx="14" fill="#08427B"/>
  <use href="#picon" x="80" y="530"/>
  <text x="112" y="540" font-size="14" font-weight="bold" fill="#ffffff">Наблюдатель (readonly)</text>
  <text x="112" y="562" font-size="12" fill="#ffffff">Только чтение; мутации отклоняются</text>
  <text x="112" y="580" font-size="12" fill="#ffffff">двойной проверкой canWrite() в</text>
  <text x="112" y="598" font-size="12" fill="#ffffff">Server Actions</text>

  <!-- Основная система -->
  <rect x="540" y="300" width="430" height="240" rx="16" fill="#1168BD"/>
  <text x="755" y="345" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Регистр депрессивных расстройств</text>
  <text x="755" y="366" font-size="12" fill="#D6E4F5" text-anchor="middle">[Software System]</text>
  <text x="570" y="398" font-size="12" fill="#ffffff">Клинический регистр: паспорт пациента,</text>
  <text x="570" y="417" font-size="12" fill="#ffffff">матрица фаз заболевания, шкалы;</text>
  <text x="570" y="436" font-size="12" fill="#ffffff">роли + row-level access; аудит append-only;</text>
  <text x="570" y="455" font-size="12" fill="#ffffff">CAS-разрешение конфликтов без молчей</text>
  <text x="570" y="474" font-size="12" fill="#ffffff">потери данных врача.</text>
  <text x="755" y="515" font-size="12" font-style="italic" fill="#D6E4F5" text-anchor="middle">Работает на Cloudflare Workers + D1 (см. L2)</text>

  <!-- Внешняя: Cloudflare Access -->
  <rect x="1120" y="220" width="400" height="120" rx="14" fill="#CCCCCC" stroke="#777777" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1150" y="250" font-size="14" font-weight="bold" fill="#333333">Cloudflare Access (Zero Trust)</text>
  <text x="1150" y="270" font-size="11.5" fill="#555555">[External System — опция эскалации]</text>
  <text x="1150" y="292" font-size="12" fill="#333333">SSO поверх текущих сессий при выходе</text>
  <text x="1150" y="310" font-size="12" fill="#333333">на внешних пользователей (auth.md §2)</text>

  <!-- Внешняя: EHR -->
  <rect x="1120" y="470" width="400" height="120" rx="14" fill="#CCCCCC" stroke="#777777" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1150" y="500" font-size="14" font-weight="bold" fill="#333333">Внешняя EHR / МИС</text>
  <text x="1150" y="520" font-size="11.5" fill="#555555">[External System — будущее]</text>
  <text x="1150" y="542" font-size="12" fill="#333333">Обмен данными регистра не реализован</text>
  <text x="1150" y="560" font-size="12" fill="#333333">(границы демо-проекта)</text>
  <!-- Связи L1 -->
  <line x1="370" y1="205" x2="538" y2="358" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="430" y="262" font-size="11.5" fill="#333333" text-anchor="middle">HTTPS · Server Actions</text>
  <text x="430" y="278" font-size="11.5" fill="#333333" text-anchor="middle">чтение и запись карт пациентов</text>

  <line x1="370" y1="390" x2="538" y2="412" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="452" y="386" font-size="11.5" fill="#333333" text-anchor="middle">HTTPS · /admin/users, инвайты</text>

  <line x1="370" y1="560" x2="538" y2="472" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="438" y="540" font-size="11.5" fill="#333333" text-anchor="middle">HTTPS · только чтение</text>

  <line x1="1120" y1="282" x2="972" y2="338" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="1048" y="288" font-size="11.5" fill="#555555" text-anchor="middle">SSO JWT (опция)</text>

  <line x1="968" y1="472" x2="1118" y2="518" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="1042" y="466" font-size="11.5" fill="#555555" text-anchor="middle">выгрузка / обмен (future)</text>

  <line x1="40" y1="676" x2="1520" y2="676" stroke="#BBBBBB" stroke-width="1"/>

  <!-- ===== C4 L2 — Container ===== -->
  <text x="40" y="708" font-size="16" font-weight="bold" fill="#1168BD">C4 L2 — Container</text>

  <!-- Персона: Врач -->
  <rect x="40" y="750" width="330" height="110" rx="14" fill="#08427B"/>
  <use href="#picon" x="80" y="770"/>
  <text x="112" y="780" font-size="14" font-weight="bold" fill="#ffffff">Врач (clinician)</text>
  <text x="112" y="802" font-size="12" fill="#ffffff">Регистр, матрица фаз, отчёты —</text>
  <text x="112" y="820" font-size="12" fill="#ffffff">через браузер</text>

  <!-- Персона: Администратор -->
  <rect x="40" y="900" width="330" height="110" rx="14" fill="#08427B"/>
  <use href="#picon" x="80" y="920"/>
  <text x="112" y="930" font-size="14" font-weight="bold" fill="#ffffff">Администратор (admin)</text>
  <text x="112" y="952" font-size="12" fill="#ffffff">/admin/users, инвайты, роли,</text>
  <text x="112" y="970" font-size="12" fill="#ffffff">переключатель data_scope</text>

  <!-- Контейнер: Браузер -->
  <rect x="420" y="760" width="300" height="140" rx="14" fill="#438DD5"/>
  <text x="570" y="790" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Браузер</text>
  <text x="570" y="809" font-size="11.5" fill="#D6E4F5" text-anchor="middle">[Container: JavaScript / React]</text>
  <text x="440" y="833" font-size="12" fill="#ffffff">RSC-гидратация, zustand (гранулярные</text>
  <text x="440" y="851" font-size="12" fill="#ffffff">подписки на ячейку), виртуализация</text>
  <text x="440" y="869" font-size="12" fill="#ffffff">матрицы; обновления — polling 30–60 с</text>

  <!-- Граница системы -->
  <rect x="770" y="730" width="750" height="940" rx="10" fill="#FCFCFC" stroke="#666666" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="788" y="758" font-size="13" font-weight="bold" fill="#333333">RDD [Software System] — контейнеры</text>

  <!-- Контейнер: Next.js -->
  <rect x="810" y="790" width="680" height="180" rx="14" fill="#438DD5"/>
  <text x="1150" y="822" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Next.js приложение</text>
  <text x="1150" y="841" font-size="11.5" fill="#D6E4F5" text-anchor="middle">[Container: Next.js on Cloudflare Workers]</text>
  <text x="835" y="867" font-size="12" fill="#ffffff">SSR/RSC + Server Actions; middleware (cookie) + requireUser()/canWrite();</text>
  <text x="835" y="887" font-size="12" fill="#ffffff">собственные сессии на D1, PBKDF2-SHA256 через Web Crypto (200k итераций);</text>
  <text x="835" y="907" font-size="12" fill="#ffffff">scope-репозитории (data_scope: all/site/assigned, fail closed);</text>
  <!-- Компонент: TS-реестр -->
  <rect x="830" y="1000" width="640" height="110" rx="12" fill="#85BBF0" stroke="#438DD5" stroke-width="1.4"/>
  <text x="1150" y="1030" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TS-реестр полей (src/shared/config/registry) [Component]</text>
  <text x="850" y="1056" font-size="12" fill="#1a1a1a">Single source of truth: порождает D1-схему (gen:d1), Zod-схемы (to-zod),</text>
  <text x="850" y="1076" font-size="12" fill="#1a1a1a">UI-рендеринг, матрицу и вычисляемые поля («поле = колонка»).</text>

  <!-- Контейнер: D1 -->
  <g>
    <path d="M 830 1190 L 830 1390 A 150 18 0 0 0 1130 1390 L 1130 1190 Z" fill="#438DD5"/>
    <ellipse cx="980" cy="1190" rx="150" ry="18" fill="#438DD5" stroke="#ffffff" stroke-width="1.2"/>
    <text x="980" y="1252" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">БД Cloudflare D1</text>
    <text x="980" y="1272" font-size="11.5" fill="#D6E4F5" text-anchor="middle">[Container: SQLite]</text>
    <text x="980" y="1296" font-size="12" fill="#ffffff" text-anchor="middle">patients, фазы, users, sessions,</text>
    <text x="980" y="1314" font-size="12" fill="#ffffff" text-anchor="middle">invites, audit_log; в БД — только</text>
    <text x="980" y="1332" font-size="12" fill="#ffffff" text-anchor="middle">SHA-256(токен) сессии</text>
  </g>

  <!-- Инструмент: Admin CLI -->
  <rect x="1190" y="1210" width="290" height="140" rx="12" fill="#EAF2FB" stroke="#438DD5" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1335" y="1240" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Admin CLI [Tool]</text>
  <text x="1210" y="1266" font-size="12" fill="#333333">npm run user:create: первый</text>
  <text x="1210" y="1284" font-size="12" fill="#333333">пользователь — admin; миграции</text>
  <text x="1210" y="1302" font-size="12" fill="#333333">через wrangler d1 execute</text>
  <text x="1210" y="1320" font-size="12" fill="#333333">(local / --remote)</text>

  <!-- Внешние (низ) -->
  <rect x="830" y="1700" width="320" height="110" rx="14" fill="#CCCCCC" stroke="#777777" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="990" y="1730" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Cloudflare Access (опция)</text>
  <text x="990" y="1750" font-size="11.5" fill="#555555" text-anchor="middle">[External System]</text>
  <text x="990" y="1772" font-size="12" fill="#333333" text-anchor="middle">SSO JWT при эскалации</text>

  <rect x="1210" y="1700" width="310" height="110" rx="14" fill="#CCCCCC" stroke="#777777" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1365" y="1730" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">Внешняя EHR / МИС (future)</text>
  <text x="1365" y="1750" font-size="11.5" fill="#555555" text-anchor="middle">[External System]</text>
  <text x="1365" y="1772" font-size="12" fill="#333333" text-anchor="middle">интеграция не реализована</text>

  <!-- Связи L2 -->
  <line x1="370" y1="800" x2="418" y2="822" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="392" y="790" font-size="11" fill="#333333" text-anchor="middle">HTTPS</text>

  <line x1="720" y1="825" x2="808" y2="852" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="763" y="810" font-size="11" fill="#333333" text-anchor="middle">RSC payload /</text>
  <text x="763" y="824" font-size="11" fill="#333333" text-anchor="middle">Server Actions</text>

  <line x1="370" y1="965" x2="808" y2="898" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="575" y="978" font-size="11.5" fill="#333333" text-anchor="middle">HTTPS · admin-UI</text>

  <line x1="1150" y1="970" x2="1150" y2="998" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1162" y="990" font-size="11" fill="#333333">использует</text>

  <line x1="950" y1="1110" x2="950" y2="1176" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="960" y="1150" font-size="11" fill="#333333">схема (gen:d1)</text>

  <path d="M 880 970 C 830 1050 820 1120 880 1176" fill="none" stroke="#444444" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="812" y="1062" font-size="11.5" fill="#333333" text-anchor="end">SQL через D1 bindings</text>
  <text x="812" y="1078" font-size="11.5" fill="#333333" text-anchor="end">аудит — один db.batch</text>

  <line x1="1190" y1="1280" x2="1136" y2="1286" stroke="#444444" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1162" y="1268" font-size="11" fill="#333333" text-anchor="middle">SQL / миграции</text>

  <path d="M 940 1700 C 790 1500 780 1150 850 974" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="762" y="1352" font-size="11.5" fill="#555555" text-anchor="end">SSO JWT (опция</text>
  <text x="762" y="1368" font-size="11.5" fill="#555555" text-anchor="end">эскалации)</text>

  <path d="M 1490 940 C 1530 1200 1500 1500 1400 1696" fill="none" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arr)"/>
  <text x="1468" y="1296" font-size="11.5" fill="#555555" text-anchor="end">обмен данными</text>
  <text x="1468" y="1312" font-size="11.5" fill="#555555" text-anchor="end">(не реализовано)</text>

  <!-- ===== Легенда ===== -->
  <rect x="40" y="1840" width="1480" height="180" rx="8" fill="#F7F9FB" stroke="#DDDDDD"/>
  <text x="60" y="1868" font-size="13" font-weight="bold" fill="#1a1a1a">Легенда</text>

  <rect x="60" y="1885" width="22" height="14" fill="#08427B"/>
  <text x="90" y="1897" font-size="12" fill="#333333">Персона</text>
  <rect x="200" y="1885" width="22" height="14" fill="#1168BD"/>
  <text x="230" y="1897" font-size="12" fill="#333333">Software System</text>
  <rect x="390" y="1885" width="22" height="14" fill="#438DD5"/>
  <text x="420" y="1897" font-size="12" fill="#333333">Container / БД</text>
  <rect x="560" y="1885" width="22" height="14" fill="#85BBF0" stroke="#438DD5"/>
  <text x="590" y="1897" font-size="12" fill="#333333">Компонент внутри контейнера</text>
  <rect x="830" y="1885" width="22" height="14" fill="#CCCCCC" stroke="#777777" stroke-dasharray="4 3"/>
  <text x="860" y="1897" font-size="12" fill="#333333">Внешняя система (опция / будущее — пунктир)</text>

  <line x1="60" y1="1925" x2="82" y2="1925" stroke="#444444" stroke-width="1.6"/>
  <text x="90" y="1929" font-size="12" fill="#333333">реализовано в v1</text>
  <line x1="200" y1="1925" x2="222" y2="1925" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="230" y="1929" font-size="12" fill="#333333">опция эскалации / future (Cloudflare Access, EHR)</text>

  <text x="60" y="1962" font-size="11" fill="#555555">Диаграмма схематична, пропорции не масштабны. Текстовая версия с обоснованиями «проблема → варианты → решение»:</text>
  <text x="60" y="1980" font-size="11" fill="#555555">docs/architecture-overview.md (точка входа) · docs/rdd-v1.md (ядро, схема) · docs/auth.md (сессии, row-level access) · docs/matrix.md (матрица, аудит)</text>
</svg>
